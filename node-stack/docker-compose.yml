version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: ${PROJECT_NAME:-node-stack}-postgres
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:-node-stack}-redis
    command: redis-server --save 60 1 --loglevel warning --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    container_name: ${PROJECT_NAME:-node-stack}-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9002:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${PROJECT_NAME:-node-stack}-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ${PROJECT_NAME:-node-stack}-jaeger
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: ${PROJECT_NAME:-node-stack}-api
    ports:
      - "${API_PORT:-4000}:4000"
    command: pnpm --filter @node-stack/api dev
    env_file:
      - apps/api/.env
      - .env
    volumes:
      # Bind-mount the full monorepo for live-reload
      - .:/app
      # Protect node_modules from host override using named volumes
      # These preserve the Linux-native installs from the Docker image build
      - api_node_modules:/app/node_modules
      - api_app_node_modules:/app/apps/api/node_modules
      - worker_app_node_modules:/app/apps/worker/node_modules
    environment:
      - DATABASE_URL=postgresql://app_user:changeme@postgres:5432/app
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - FORCE_COLOR=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: ${PROJECT_NAME:-node-stack}-worker
    command: pnpm --filter @node-stack/worker dev
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://app_user:changeme@postgres:5432/app
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - FORCE_COLOR=1
    volumes:
      # Bind-mount the full monorepo for live-reload
      - .:/app
      # Protect node_modules from host override using named volumes
      - worker_root_node_modules:/app/node_modules
      - worker_worker_node_modules:/app/apps/worker/node_modules
      - worker_api_node_modules:/app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  pgadmin_data:
    driver: local
  # Named volumes for node_modules — prevents host Windows symlinks from contaminating containers
  # IMPORTANT: Run `docker compose down -v` when you change dependencies to recreate these
  api_node_modules:
    driver: local
  api_app_node_modules:
    driver: local
  worker_app_node_modules:
    driver: local
  worker_root_node_modules:
    driver: local
  worker_worker_node_modules:
    driver: local
  worker_api_node_modules:
    driver: local

networks:
  app-network:
    driver: bridge
    name: ${PROJECT_NAME:-node-stack}_network
