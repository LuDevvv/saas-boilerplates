services:
  postgres:
    image: postgres:15-alpine
    container_name: ${PROJECT_NAME:-node-stack}-postgres
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:-node-stack}-redis
    command: redis-server --save 60 1 --loglevel warning --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: ${PROJECT_NAME:-node-stack}-api
    ports:
      - "${API_PORT:-4000}:4000"
    command: pnpm --filter @node-stack/api dev
    env_file:
      - apps/api/.env
      - .env
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_app_node_modules:/app/apps/api/node_modules
      - worker_app_node_modules:/app/apps/worker/node_modules
    environment:
      - DATABASE_URL=postgresql://app_user:changeme@postgres:5432/app
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - FORCE_COLOR=1
      # Storage credentials come from apps/api/.env (STORAGE_S3_* or STORAGE_PROVIDER=local)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 256M

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: ${PROJECT_NAME:-node-stack}-worker
    command: pnpm --filter @node-stack/worker dev
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://app_user:changeme@postgres:5432/app
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - FORCE_COLOR=1
    volumes:
      - .:/app
      - worker_root_node_modules:/app/node_modules
      - worker_worker_node_modules:/app/apps/worker/node_modules
      - worker_api_node_modules:/app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 128M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # Named volumes for node_modules — prevents host Windows symlinks from contaminating containers
  # IMPORTANT: Run `docker compose down -v` when you change dependencies to recreate these
  api_node_modules:
    driver: local
  api_app_node_modules:
    driver: local
  worker_app_node_modules:
    driver: local
  worker_root_node_modules:
    driver: local
  worker_worker_node_modules:
    driver: local
  worker_api_node_modules:
    driver: local

networks:
  app-network:
    driver: bridge
    name: ${PROJECT_NAME:-node-stack}_network
