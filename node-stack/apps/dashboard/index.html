<!DOCTYPE html>
<html lang="es">
  <head>
    <script src="https://unpkg.com/react-scan/dist/auto.global.js" crossorigin="anonymous"></script>
    <title>
      NodeStack Dashboard - Panel de Control
    </title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes"       
    />

    <!-- Disable Workbox Logs -->
    <script>
      self.__WB_DISABLE_DEV_LOGS = true;

      // Theme detection to prevent FOUC
      (function() {
        try {
          const storage = JSON.parse(localStorage.getItem('theme-storage'));
          if (storage && storage.state && storage.state.theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#7144F9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NodeStack" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Meta tags SEO -->
    <meta
      name="description"
      content="Panel de administración de NodeStack."
    />

    <!-- Fuentes -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" 
      rel="stylesheet"
      type="text/css"
    />

    <!-- Favicon & PWA Icons -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!-- Habilitar indexaciÃ³n -->
    <meta name="robots" content="index, follow" />

    <!-- Polar.sh Checkout SDK -->
    <script src="https://get.polar.sh/checkout.js" defer></script>
  </head>

  <body class="bg-gray-50 text-gray-950 dark:bg-gray-950 dark:text-white">
    <div id="root"></div>

    <noscript>
      <div style="padding: 20px; text-align: center">
        <h1>NodeStack Dashboard</h1>
        <p>
          Para usar esta aplicaciÃ³n, por favor habilita JavaScript en tu
          navegador.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
