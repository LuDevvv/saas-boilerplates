<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socket.io Test Client</title>
  <style>
    body { font-family: monospace; padding: 20px; max-width: 800px; margin: 0 auto; }
    .log { background: #1e1e1e; color: #0f0; padding: 10px; margin: 10px 0; height: 300px; overflow-y: auto; border-radius: 4px; }
    .error { color: #f55; }
    .info { color: #55f; }
    input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }
  </style>
</head>
<body>
  <h1>Socket.io Test Client</h1>
  
  <div class="row">
    <input type="text" id="token" placeholder="JWT Token (Bearer ...)">
    <input type="text" id="workspaceId" placeholder="Workspace ID (optional)">
  </div>
  <button onclick="connect()">Connect</button>
  <button onclick="disconnect()">Disconnect</button>
  
  <h3>Events</h3>
  <div class="row">
    <button onclick="simulateNotification()">Simulate notification.created</button>
    <button onclick="simulateAIJob()">Simulate ai_job.completed</button>
    <button onclick="simulateWebhookFailed()">Simulate webhook.delivery.failed</button>
  </div>
  
  <h3>Logs</h3>
  <div class="log" id="log"></div>

  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  <script>
    let socket = null;
    const logEl = document.getElementById('log');
    
    function log(msg, type = '') {
      const line = document.createElement('div');
      line.textContent = `[${new Date().toISOString()}] ${msg}`;
      if (type) line.className = type;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function connect() {
      const token = document.getElementById('token').value;
      const workspaceId = document.getElementById('workspaceId').value;
      
      if (!token) {
        log('Please enter a JWT token', 'error');
        return;
      }

      socket = io('http://localhost:4000/v1/realtime', {
        auth: { token: token.startsWith('Bearer ') ? token : `Bearer ${token}` },
        query: { workspaceId },
        transports: ['websocket'],
      });

      socket.on('connect', () => log('Connected: ' + socket.id, 'info'));
      socket.on('disconnect', (reason) => log('Disconnected: ' + reason, 'error'));
      socket.on('connect_error', (err) => log('Connection error: ' + err.message, 'error'));
      
      socket.on('notification.created', (data) => log('notification.created: ' + JSON.stringify(data)));
      socket.on('ai_job.completed', (data) => log('ai_job.completed: ' + JSON.stringify(data)));
      socket.on('webhook.delivery.failed', (data) => log('webhook.delivery.failed: ' + JSON.stringify(data)));
    }

    function disconnect() {
      if (socket) {
        socket.disconnect();
        socket = null;
      }
    }

    function simulateNotification() {
      log('Send to backend: notification.created (via HTTP API)');
    }

    function simulateAIJob() {
      log('Send to backend: ai_job.completed (via HTTP API)');
    }

    function simulateWebhookFailed() {
      log('Send to backend: webhook.delivery.failed (via HTTP API)');
    }
  </script>
</body>
</html>
