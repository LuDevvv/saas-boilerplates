server {
    listen 80;

    location / {
        # CORS preflight
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'  '*'                                           always;
            add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, DELETE, HEAD, OPTIONS'      always;
            add_header 'Access-Control-Allow-Headers' '*'                                           always;
            add_header 'Access-Control-Max-Age'       '3600'                                        always;
            add_header 'Content-Length'               '0';
            return 204;
        }

        add_header 'Access-Control-Allow-Origin'   '*'                  always;
        add_header 'Access-Control-Expose-Headers' 'ETag, Content-Length' always;

        proxy_pass              http://minio:9000;
        # Forward the original Host so MinIO validates the presigned URL signature correctly
        proxy_set_header        Host              $http_host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;

        # Allow large file uploads
        client_max_body_size    512m;
        proxy_request_buffering off;
    }
}
