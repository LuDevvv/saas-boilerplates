name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: node-stack

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: node-stack/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: node-stack/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: build workspace packages
        run: pnpm --filter "./packages/*" build
      - name: typecheck apps/api with workspace deps
        working-directory: node-stack/apps/api
        run: npx tsc -b --noEmit
      - name: typecheck apps/worker with workspace deps
        working-directory: node-stack/apps/worker
        run: npx tsc -b --noEmit

  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: node-stack/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: build all packages and apps
        run: pnpm build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
      MIGRATION_DATABASE_URL: postgres://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcd
      JWT_REFRESH_SECRET: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      TRUST_PROXY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: node-stack/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: build workspace packages
        run: pnpm --filter "./packages/*" build
      - run: pnpm --filter @node-stack/db db:migrate:full
      - run: pnpm -r test --if-present
        # Phase 3b lands the test baseline (TotpSecretCipher, audit
        # taxonomy, EncryptionUtils round-trip + tamper detection).
        # The job is now mandatory; new specs that fail block merge.
      - name: integration tests (testcontainers postgres + redis)
        run: pnpm --filter @node-stack/api test:integration
        # Phase 3b/3c integration suite: multi-tenancy RLS,
        # transactions/outbox atomicity, soft-delete cascade. Spins
        # up its own Postgres 16 + Redis 7 via testcontainers so the
        # service-container on 5432 above (used by the unit suite for
        # db:migrate:full) does not conflict.
