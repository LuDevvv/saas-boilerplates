name: Deploy Edge Stack

on:
  push:
    branches: [main]
  # Manual trigger for production deploys
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Workers to Cloudflare
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Neon & Stripe secrets if needed for build-time or wrangler environment injection
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build and Deploy Workers
        # Deploys api, jobs, and media workers
        run: pnpm turbo run deploy --filter=@workspace/api --filter=@workspace/jobs-worker --filter=@workspace/media-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Neon & Stripe secrets if needed for build-time or wrangler environment injection
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Sentry Release Tracking
        if: success() && env.SENTRY_AUTH_TOKEN != ''
        run: |
          VERSION=$(git rev-parse --short HEAD)
          echo "Setting up Sentry releases for $VERSION"
          # For each deployed worker
          for worker in api jobs-worker media-worker; do
            if [ -d "edge-stack/apps/$worker" ]; then
              pnpm sentry-cli releases new "$worker@$VERSION"
              pnpm sentry-cli releases set-commits "$worker@$VERSION" --auto
              pnpm sentry-cli releases finalize "$worker@$VERSION"
            fi
          done
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Axiom Deployment Markers
        if: success() && env.AXIOM_TOKEN != ''
        run: |
          VERSION=$(git rev-parse --short HEAD)
          curl -X POST "https://api.axiom.co/v1/datasets/deployments/events" \
            -H "Authorization: Bearer ${{ secrets.AXIOM_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"version\": \"$VERSION\", \"stack\": \"edge-stack\", \"event\": \"deployed\"}"
