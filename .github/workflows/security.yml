name: Security

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

defaults:
  run:
    working-directory: node-stack

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: node-stack/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod || true
        # Informational only. We do not block on audit findings yet —
        # Phase 3 will add a triage step that diffs against a baseline.
